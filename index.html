<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根词缀 · 中考→高考 词汇思维导图</title>
<meta name="theme-color" content="#042C53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script defer src="supabase.min.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#FAFAF8;color:#222;
}
/* ========== 整体框架 ========== */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:250px;flex:0 0 250px;background:#fff;border-right:1px solid #E3E1DA;
  display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.sb-head{padding:14px 16px 10px;border-bottom:1px solid #EEE;}
.sb-title{font-size:15px;font-weight:700;color:#042C53;}
.sb-sub{font-size:11px;color:#888;margin-top:3px;line-height:1.5;}
#searchBox{
  width:100%;margin-top:10px;padding:6px 10px;border:1px solid #DDD;border-radius:6px;
  font-size:12px;font-family:inherit;outline:none;
}
#searchBox:focus{border-color:#185FA5;}
#rootList{list-style:none;margin:0;padding:6px 0 20px;overflow-y:auto;flex:1;}
#rootList li{
  padding:8px 16px;cursor:pointer;font-size:12.5px;line-height:1.45;
  border-left:3px solid transparent;display:flex;align-items:baseline;gap:6px;
}
#rootList li:hover{background:#F4F6F8;}
#rootList li.active{background:#E6F1FB;border-left-color:#185FA5;}
.rk-name{font-weight:600;color:#0C447C;flex:0 0 auto;}
.rk-mean{font-size:11px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-cnt{margin-left:auto;font-size:10px;color:#B0AEA4;flex:0 0 auto;}
.main{flex:1;overflow:auto;position:relative;}
.topbar{
  position:sticky;top:0;background:#FAFAF8;padding:12px 24px;z-index:10;
  border-bottom:1px solid #E9E7E0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.topbar button{
  padding:6px 14px;border:1px solid #185FA5;background:#E6F1FB;color:#0C447C;
  border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit;
}
.topbar button:hover{background:#D4E6F7;}
.legend{margin-left:auto;font-size:11px;color:#777;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.lg-zk{background:#D93025;}
.lg-gk{background:#E6F1FB;border:1px solid #185FA5;}
.lg-txt{color:#D93025;font-weight:700;}
#menuBtn{display:none;}

/* ========== 页面 ========== */
.page{display:none;padding:8px 24px 60px;}
.page.active{display:block;}
.page-head{
  max-width:680px;margin:0 auto 6px;background:#fff;border:1px solid #E3E1DA;
  border-radius:10px;padding:12px 16px;
}
.ph-root{font-size:19px;font-weight:800;color:#042C53;}
.ph-mean{font-size:13px;color:#0F6E56;font-weight:600;margin-left:8px;}
.ph-origin{font-size:11px;color:#999;font-weight:400;margin-left:6px;}
.ph-stat{font-size:11px;color:#888;margin-top:5px;}
.diagram{position:relative;min-width:680px;width:max-content;min-height:300px;margin:0 auto;padding-right:24px;}
.center-node{
  position:absolute;left:250px;top:40px;width:180px;border:1px solid #185FA5;
  border-radius:12px;overflow:hidden;z-index:2;cursor:pointer;background:#fff;
  transition:box-shadow .2s ease;
}
.center-node:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);}
.center-node .center-header{
  padding:10px 14px;background:#B5D4F4;display:flex;justify-content:space-between;
  align-items:center;color:#042C53;
}
.center-node .cn{font-size:18px;font-weight:700;word-break:break-word;}
.center-node .center-body{
  padding:8px 14px 10px;font-size:12.5px;color:#0C447C;text-align:center;
  background:#fff;border-top:1px solid #D4E6F7;
}
.center-node.collapsed .center-body{display:none;}
.center-node.collapsed .toggle-icon{transform:rotate(-90deg);}
.spine{position:absolute;left:340px;width:1px;height:0;background:#B4B2A9;z-index:1;}
.crossbar{position:absolute;left:320px;width:40px;height:1px;background:#B4B2A9;z-index:1;}

/* ========== 卡片 ========== */
.card{
  position:absolute;width:280px;border-radius:10px;overflow:hidden;
  transition:box-shadow .2s ease;z-index:2;cursor:pointer;background:#fff;
}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);}
.card.gk{border:1px solid #185FA5;}
.card.zk{border:1px solid #B31412;}
.card.faved{box-shadow:0 0 0 2px #F5B301 inset;}
.card-header{
  padding:9px 13px;display:flex;justify-content:flex-start;align-items:center;
  gap:5px;font-size:13px;position:relative;
}
.card.gk .card-header{background:#E6F1FB;color:#0C447C;}
/* 中考考纲词：红底白字 */
.card.zk .card-header{background:#D93025;color:#fff;}
.card.zk .card-header .ph{opacity:.9;}
.card.zk .card-header .speak{filter:brightness(0) invert(1);opacity:.85;}
.word{font-weight:700;}
.ph{font-size:11px;opacity:.75;margin-left:3px;font-weight:400;}
.speak{
  border:none;background:transparent;cursor:pointer;font-size:12.5px;line-height:1;
  padding:2px 3px;margin-left:1px;opacity:.7;transition:opacity .15s ease,transform .1s ease;
}
.speak:hover{opacity:1;transform:scale(1.12);}
.speak:active{transform:scale(.94);}
.badge{
  font-size:9.5px;padding:1px 5px;border-radius:3px;line-height:1.5;font-weight:600;
  flex:0 0 auto;
}
.card.zk .badge{background:rgba(255,255,255,.25);color:#fff;}
.card.gk .badge{background:#D4E6F7;color:#0C447C;}
.toggle-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  font-size:12px;opacity:.6;transition:transform .2s ease;}
.card.collapsed .toggle-icon{transform:rotate(-90deg);}
.card-header .header-right{display:flex;align-items:center;gap:7px;margin-left:auto;}
.fav-btn{cursor:pointer;font-size:14px;line-height:1;color:#C9C7BD;user-select:none;
  transition:color .15s ease;}
.card.zk .fav-btn{color:rgba(255,255,255,.5);}
.fav-btn.on{color:#F5B301;}
.card.zk .fav-btn.on{color:#FFE082;}
.card.collapsed .card-body{display:none;}
.card-body{padding:9px 13px 11px;font-size:11px;line-height:1.55;background:#fff;}
.card.gk .card-body{color:#444441;border-top:1px solid #D4E6F7;}
.card.zk .card-body{color:#444441;border-top:1px solid #F3C9C6;}
.line{margin:5px 0;display:flex;flex-wrap:wrap;gap:4px;}
.label{font-weight:700;flex:0 0 auto;}
.card.gk .label{color:#185FA5;}
.card.zk .label{color:#B31412;}
.bk-text{color:#555;line-height:1.6;}
/* 词性 + 释义 */
.sense{align-items:baseline;}
.sense .pos{font-weight:700;flex:0 0 auto;font-style:italic;}
.sense .mean{flex:1;min-width:0;}
/* 中考水平：红色字体 */
.sense.zk .pos,.sense.zk .mean{color:#D93025;font-weight:600;}
.sense.gk .pos{color:#666;}
.sense.gk .mean{color:#444;}
.src-line{font-size:10px;color:#9A988F;margin:2px 0 4px;}
/* 例句 / 搭配 / 派生 */
.sec{margin-top:7px;padding-top:6px;border-top:1px dashed #E6E4DC;}
.sec-label{font-weight:700;flex:0 0 auto;}
.card.gk .sec-label{color:#185FA5;}
.card.zk .sec-label{color:#B31412;}
.sec-body{color:#555;line-height:1.65;word-break:break-word;}
.ex{margin:4px 0;padding-left:8px;border-left:2px solid #D4E6F7;}
.card.zk .ex{border-left-color:#F3C9C6;}
.ex-en{color:#333;line-height:1.55;}
.ex-tr{color:#8A887F;font-size:10px;line-height:1.5;margin-top:1px;}
.ex-src{color:#A8A69D;margin-left:3px;}
/* 用户自制卡片 + 添加按钮 */
.add-card-wrap{max-width:680px;margin:16px auto 0;text-align:center;}
.add-card-btn{padding:8px 20px;border:1px dashed #185FA5;background:#fff;color:#185FA5;
  border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;}
.add-card-btn:hover{background:#F0F6FC;}
.card-del{width:16px;height:16px;border:none;background:transparent;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;color:#C9C7BD;opacity:.75;
  transition:color .15s ease,opacity .15s ease;}
.card-del:hover{color:#E0584B;opacity:1;}
.card.zk .card-del{color:rgba(255,255,255,.6);}
.card.zk .card-del:hover{color:#FFD5D2;}
/* 排序模式 */
.card.sortable{cursor:grab;}
.card.sortable:active{cursor:grabbing;}
.card.dragging{opacity:.45;box-shadow:0 0 0 2px #185FA5 inset;}
.drag-handle{display:none;cursor:grab;color:#9A988F;font-size:15px;line-height:1;
  user-select:none;margin-right:3px;flex:0 0 auto;}
.move-btn{display:none;border:none;background:transparent;cursor:pointer;font-size:11px;
  color:#185FA5;padding:1px 3px;line-height:1;flex:0 0 auto;}
.move-btn:hover{color:#0C447C;background:#D4E6F7;border-radius:4px;}
.diagram.sorting .card{box-shadow:0 0 0 2px #185FA5 inset;}
.diagram.sorting .drag-handle{display:inline-flex;align-items:center;}
.diagram.sorting .move-btn{display:inline-block;}
.diagram.sorting .toggle-icon{display:none;}
.topbar button.active{background:#0C447C;color:#fff;border-color:#0C447C;}
/* 表单弹窗 */
.modal-box.wide{width:400px;max-width:92vw;text-align:left;padding:18px 20px;}
.modal-title{font-size:14px;font-weight:700;color:#042C53;margin-bottom:12px;}
.form-row{margin-bottom:9px;}
.form-row label{display:block;font-size:11px;color:#666;margin-bottom:3px;font-weight:600;}
.form-row label small{font-weight:400;color:#9A988F;}
.form-row input,.form-row textarea{
  width:100%;padding:6px 9px;border:1px solid #DDD;border-radius:6px;
  font-size:12px;font-family:inherit;box-sizing:border-box;color:#333;
}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:#185FA5;}
.modal-box.wide .modal-actions{justify-content:flex-end;margin-top:14px;}
/* 目录字母分组 */
#rootList li.rk-letter{
  font-size:11px;font-weight:800;color:#185FA5;background:#F0F4F8;
  padding:5px 16px;border-left-color:transparent;cursor:default;letter-spacing:1px;
}
#rootList li.rk-letter:hover{background:#F0F4F8;}
#rootList li.rk-item{padding-left:24px;}

/* ========== 笔记 ========== */
.custom{margin-top:8px;padding-top:8px;border-top:1px dashed #D4E6F7;}
.card.zk .custom{border-top-color:#F3C9C6;}
.custom-title{font-size:10px;font-weight:700;color:#999;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:4px;}
.custom-toggle{display:inline-block;transition:transform .2s ease;font-size:11px;}
.custom.collapsed .custom-toggle{transform:rotate(-90deg);}
.custom.collapsed .custom-content{display:none;}
.custom-section{margin-top:8px;}
.section-head{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;
  color:#777;margin-bottom:4px;}
.add-note{padding:2px 8px;border:1px solid #185FA5;background:#fff;color:#185FA5;
  border-radius:5px;font-size:10px;cursor:pointer;font-family:inherit;}
.add-note:hover{background:#F0F6FC;}
.note-item{margin:6px 0;}
.note-item.selected .note-view{background:#ECECEA;}
.note-view{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;background:#F7F7F5;
  border-radius:6px;font-size:11px;line-height:1.5;color:#333;}
.note-actions{display:none;gap:5px;flex-shrink:0;margin-top:1px;}
.note-item.selected .note-actions{display:flex;}
.note-action{width:18px;height:18px;border:none;background:transparent;cursor:pointer;
  font-size:13px;line-height:18px;padding:0;display:flex;align-items:center;
  justify-content:center;opacity:.65;}
.note-action:hover{opacity:1;}
.note-action.del{color:#E0584B;}
.note-render{flex:1;min-width:0;word-break:break-word;font-size:11px;line-height:1.6;color:#333;}
.note-render p{margin:4px 0;}
.note-render h1,.note-render h2,.note-render h3,.note-render h4,.note-render h5,.note-render h6
  {margin:6px 0 4px;line-height:1.3;}
.note-render h1{font-size:15px;}.note-render h2{font-size:14px;}.note-render h3{font-size:13px;}
.note-render h4,.note-render h5,.note-render h6{font-size:12px;}
.note-render ul,.note-render ol{margin:4px 0;padding-left:20px;}
.note-render li{margin:2px 0;}
.note-render blockquote{margin:4px 0;padding:2px 8px;border-left:3px solid #DDD;color:#666;}
.note-render code{background:#F0F0EC;padding:1px 4px;border-radius:4px;font-size:10px;}
.note-render pre{background:#F0F0EC;padding:8px;border-radius:6px;overflow:auto;}
.note-render pre code{background:none;padding:0;}
.note-render img{max-width:100%;border-radius:6px;margin:4px 0;cursor:zoom-in;display:block;}
.note-render a{color:#185FA5;}
.note-toolbar{margin-bottom:4px;}
.note-empty{color:#AAA;font-style:italic;}
.note-edit{display:flex;flex-direction:column;gap:6px;}
.note-input{flex:1;min-height:34px;border:1px solid #CCC;border-radius:6px;padding:5px 8px;
  font-size:11px;font-family:inherit;line-height:1.5;resize:vertical;box-sizing:border-box;color:#333;}
.note-input:focus{outline:none;border-color:#185FA5;}
.submit-note{padding:5px 12px;border:none;background:#185FA5;color:#fff;border-radius:5px;
  font-size:11px;cursor:pointer;flex-shrink:0;font-family:inherit;}
.submit-note:hover{opacity:.9;}
.add-img{padding:2px 8px;border:1px solid #185FA5;background:#fff;color:#185FA5;
  border-radius:5px;font-size:10px;cursor:pointer;font-family:inherit;}
.cancel-img{padding:4px 12px;border:1px solid #AAA;background:#fff;color:#777;
  border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;}
.img-edit-actions{display:flex;gap:6px;}

/* ========== 弹层 ========== */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;
  justify-content:center;z-index:99;cursor:zoom-out;overflow:auto;padding:20px;}
.lightbox img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:8px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
  justify-content:center;z-index:100;}
.modal-box{background:#fff;border-radius:10px;padding:20px 22px;width:260px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center;}
.modal-msg{font-size:13px;color:#333;margin-bottom:18px;line-height:1.5;}
.modal-actions{display:flex;gap:12px;justify-content:center;}
.modal-btn{padding:6px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:none;font-family:inherit;}
.modal-btn.cancel{background:#EEE;color:#555;}
.modal-btn.ok{background:#E0584B;color:#fff;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:rgba(28,28,28,.92);color:#fff;font-size:12px;padding:9px 16px;border-radius:8px;
  z-index:999;max-width:80%;text-align:center;opacity:0;transition:opacity .2s ease;pointer-events:none;}
.toast.show{opacity:1;}
.env-tip{font-size:11px;color:#B45309;background:#FEF3C7;border:1px solid #FCD34D;
  border-radius:6px;padding:3px 8px;}

/* ========== 自定义标题颜色 ========== */
.color-btn{border:none;background:transparent;cursor:pointer;font-size:12px;line-height:1;
  padding:1px 2px;margin-left:2px;opacity:.7;flex:0 0 auto;}
.color-btn:hover{opacity:1;}
.card.zk .color-btn{filter:brightness(0) invert(1);opacity:.8;}
.color-pop{position:fixed;display:none;z-index:200;background:#fff;border:1px solid #DDD;
  border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px;width:200px;}
.color-pop-title{font-size:12px;font-weight:700;color:#042C53;margin-bottom:8px;}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,.1);}
.sw:hover{transform:scale(1.1);}
.color-pop-row{margin-top:6px;font-size:11px;color:#666;}
.color-pop-row input[type=color]{vertical-align:middle;margin-left:4px;}
.color-pop-row button{border:1px solid #AAA;background:#fff;color:#555;border-radius:5px;
  font-size:11px;cursor:pointer;font-family:inherit;padding:3px 8px;}

/* ========== 嵌套（父子分支） ========== */
.branch-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.card.child{width:260px;position:absolute;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card.child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#185FA5;border-radius:10px 0 0 10px;}
.card.zk.child::before{background:#D93025;}
.branch-badge{font-size:9.5px;background:#E6F1FB;color:#0C447C;border-radius:8px;
  padding:1px 6px;margin-right:4px;font-weight:600;}
.card.zk .branch-badge{background:rgba(255,255,255,.25);color:#fff;}
.diagram.nesting .card{cursor:grab;box-shadow:0 0 0 2px #2F9E44 inset;}
.diagram.nesting .card.drop-target{box-shadow:0 0 0 3px #2F9E44 inset;background:#F4FBF6;}
.diagram.nesting .toggle-icon{display:none;}
.diagram.nesting .drag-handle,.diagram.nesting .move-btn{display:none;}

/* ========== 登录门禁 ========== */
.auth-gate{display:none;position:fixed;inset:0;z-index:300;
  background:linear-gradient(135deg,#042C53,#0C447C);align-items:center;justify-content:center;}
.auth-card{background:#fff;border-radius:14px;padding:26px 26px 22px;width:320px;max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,.3);}
.auth-logo{font-size:20px;font-weight:800;color:#042C53;text-align:center;}
.auth-sub{font-size:11px;color:#888;text-align:center;margin:6px 0 16px;line-height:1.5;}
.auth-tabs{display:flex;gap:8px;margin-bottom:14px;}
.auth-tabs button{flex:1;padding:7px;border:1px solid #DDD;background:#F7F7F5;color:#555;
  border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;}
.auth-tabs button.active{background:#0C447C;color:#fff;border-color:#0C447C;}
.auth-card input{width:100%;padding:9px 11px;margin-bottom:10px;border:1px solid #DDD;
  border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box;}
.auth-card input:focus{outline:none;border-color:#185FA5;}
.auth-btn{width:100%;padding:10px;border:none;background:#185FA5;color:#fff;border-radius:8px;
  font-size:14px;cursor:pointer;font-family:inherit;}
.auth-btn:hover{opacity:.92;}
.auth-err{color:#E0584B;font-size:11.5px;margin-top:8px;min-height:14px;line-height:1.4;}
.ub-email{font-size:11px;color:#555;margin-right:8px;}
.ub-badge{display:inline-flex;align-items:center;gap:5px;background:#E6F1FB;color:#0C447C;
  border:1px solid #BCD9F5;border-radius:20px;padding:4px 13px;font-size:12.5px;font-weight:700;margin-right:8px;
  white-space:nowrap;box-shadow:0 1px 3px rgba(12,68,124,.12);}
.ub-logout{border:1px solid #C9A227;background:#FFF7E6;color:#9A6B00;border-radius:18px;font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:inherit;padding:4px 13px;}
.ub-logout:hover{background:#FDE9C2;}

/* ========== 手机响应式 ========== */
@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:2px 0 12px rgba(0,0,0,.12);}
  .sidebar.open{transform:translateX(0);}
  #menuBtn{display:inline-block;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none;}
  .scrim.show{display:block;}
  .page{padding:8px 12px 60px;}
  .topbar{padding:10px 12px;gap:8px;}
  .diagram{width:100%!important;height:auto!important;}
  .center-node{position:relative!important;left:auto!important;top:auto!important;
    width:100%!important;max-width:230px;margin:0 auto 16px;}
  .card{position:relative!important;left:auto!important;top:auto!important;
    width:100%!important;margin-bottom:14px;}
  .card.child{margin:10px 0 10px 18px;}
  .spine,.crossbar{display:none!important;}
  .legend{width:100%;margin-left:0;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">

const UD = { fav:{}, notes:{}, custom:{}, order:{}, colors:{}, parent:{} };
function sanitizeUD(o){
  const d = { fav:{}, notes:{}, custom:{}, order:{}, colors:{}, parent:{} };
  if (o && typeof o === 'object'){ for (const k in d){ if (o[k] && typeof o[k] === 'object') d[k] = o[k]; } }
  return d;
}
function ckey(card){ return cardIdx(card) + ':' + card.dataset.word; }
function cardIdx(card){ return parseInt(card.closest('.page').dataset.idx, 10); }
function persistLocal(){ try { localStorage.setItem('ud_cache_v1', JSON.stringify(UD)); } catch (e){} }
let _sbSaveT = null;
function persist(){
  persistLocal();
  if (typeof sbSave === 'function') sbSave();
}
function migrateLegacy(){
  // 旧版 localStorage 数据迁移到 UD（保留既有用户数据）
  const raw = localStorage.getItem('ud_cache_v1');
  if (raw){ try { Object.assign(UD, sanitizeUD(JSON.parse(raw))); return; } catch (e){} }
  // 没有缓存：从更老的单键结构迁移
  const wordIdx = {};
  ROOTS.forEach((r, i) => { r.words.forEach(w => { wordIdx[w.w] = i; }); });
  try {
    ROOTS.forEach((r, i) => {
      const cust = localStorage.getItem('roots_v1_custom_' + i);
      if (cust){ try { UD.custom[i] = JSON.parse(cust); } catch (e){} localStorage.removeItem('roots_v1_custom_' + i); }
      const ord = localStorage.getItem('roots_v1_order_' + i);
      if (ord){ try { UD.order[i] = JSON.parse(ord); } catch (e){} localStorage.removeItem('roots_v1_order_' + i); }
    });
    document.querySelectorAll && null;
    ROOTS.forEach((r, i) => {
      r.words.forEach(w => {
        if (localStorage.getItem('zk_' + w.w + '_fav') === '1') UD.fav[i + ':' + w.w] = '1';
        const nt = localStorage.getItem('zk_' + w.w + '_notes');
        if (nt){ try { UD.notes[i + ':' + w.w] = JSON.parse(nt); } catch (e){} }
        localStorage.removeItem('zk_' + w.w + '_fav');
        localStorage.removeItem('zk_' + w.w + '_notes');
      });
    });
  } catch (e){}
  persistLocal();
}

/* ================= 构建目录（按词根首字母 A-Z 分组） ================= */
function buildNav(){
  const ul = document.getElementById('rootList');
  ul.innerHTML = '';
  const groups = {};
  ROOTS.forEach((r, i) => {
    const ch = (r.root || '#').trim().charAt(0).toUpperCase();
    const L = /[A-Z]/.test(ch) ? ch : '#';
    (groups[L] = groups[L] || []).push({ i: i, r: r });
  });
  Object.keys(groups).sort().forEach(L => {
    const head = document.createElement('li');
    head.className = 'rk-letter';
    head.dataset.letter = L;
    head.textContent = L;
    ul.appendChild(head);

/* ================= 布局（支持任意卡片数 + 嵌套分支） ================= */
function renderLines(diagram, lines){
  let svg = diagram.querySelector('.branch-svg');
  if (!svg){
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'branch-svg');
    diagram.insertBefore(svg, diagram.firstChild);
  }
  svg.setAttribute('width', diagram.offsetWidth);
  svg.setAttribute('height', diagram.offsetHeight);
  svg.innerHTML = '';
  lines.forEach(ln => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d;
    if (ln.type === 'spine') d = 'M ' + ln.x1 + ' ' + ln.y1 + ' V ' + ln.y2;
    else if (ln.type === 'crossbar') d = 'M ' + ln.x1 + ' ' + ln.y1 + ' H ' + ln.x2;
    else d = 'M ' + ln.x1 + ' ' + ln.y1 + ' H ' + ln.x2 + ' V ' + ln.y2;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#B4B2A9');
    path.setAttribute('stroke-width', '1');
    svg.appendChild(path);
  });
}
function layoutPage(page){
  const centerNode = page.querySelector('.center-node');
  if (!centerNode) return;
  const centerBottom = CENTER_TOP + centerNode.offsetHeight;
  const startTop = centerBottom + ROW_GAP;
  const diagram = page.querySelector('.diagram');
  const idx = parseInt(page.dataset.idx, 10);
  const allCards = Array.from(page.querySelectorAll('.card'));
  const cardByWord = {};
  allCards.forEach(c => { cardByWord[c.dataset.word] = c; });

  // 解析有效的父子关系
  const parentOf = {}, children = {};
  allCards.forEach(c => {
    const p = c.dataset.parent;
    if (p && cardByWord[p] && cardByWord[p] !== c){
      parentOf[c.dataset.word] = p;
      children[p] = children[p] || [];
      children[p].push(c.dataset.word);
    }
  });

  // 顶层卡片按保存顺序排列
  const orderMap = {};
  (UD.order[idx] || []).forEach((id, i) => { orderMap[id] = i; });
  const topCards = allCards.filter(c => !parentOf[c.dataset.word]);
  topCards.sort((a, b) => {
    const ia = orderMap[cardId(a)], ib = orderMap[cardId(b)];
    if (ia != null && ib != null) return ia - ib;
    if (ia != null) return -1;
    if (ib != null) return 1;
    return 0;
  });

  // 计算整个子树占用的垂直高度（仅统计当前展开的卡片；子卡片在右侧，不参与父卡片下方堆叠）
  function treeHeight(word){
    const c = cardByWord[word];
    if (!c || c.style.display === 'none') return 0;
    let h = c.offsetHeight;
    let childH = 0;
    (children[word] || []).forEach(cw => { childH += ROW_GAP + treeHeight(cw); });
    return Math.max(h, childH ? childH - ROW_GAP : 0);
  }

  const lines = [];
  // 递归布局一个节点及其子树，返回该子树占用的最底部 y 坐标
  // 规则：子卡片放在父卡片右侧，多个子卡片在右侧垂直堆叠
  function layoutNode(word, left, top){
    const c = cardByWord[word];
    if (!c || c.style.display === 'none') return top;
    c.style.position = 'absolute';
    c.style.left = left + 'px';
    c.style.top = top + 'px';
    c.style.width = (c.classList.contains('child') ? CHILD_WIDTH : CARD_WIDTH) + 'px';
    const myW = c.offsetWidth;
    const myH = c.offsetHeight;
    const childLeft = left + myW + H_GAP;
    let childTop = top;
    let childrenBottom = top;
    (children[word] || []).forEach(cw => {
      const child = cardByWord[cw];
      if (child.style.display === 'none') return;
      const yParent = top + myH / 2;
      const yChild = childTop + child.offsetHeight / 2;
      lines.push({type:'branch', x1:left + myW, y1:yParent, x2:childLeft, y2:yChild});
      childrenBottom = layoutNode(cw, childLeft, childTop);
      childTop = childrenBottom + ROW_GAP;
    });
    return Math.max(top + myH, childrenBottom);
  }

  let leftTop = startTop, rightTop = startTop, maxBottom = startTop;
  const centers = [];
  topCards.forEach((c, i) => {
    const isLeft = i % 2 === 0;
    const left = isLeft ? 40 : 360;
    const top = isLeft ? leftTop : rightTop;
    const treeBottom = layoutNode(c.dataset.word, left, top);
    const cardMidY = top + c.offsetHeight / 2;
    lines.push({type:'crossbar', x1:CENTER_X, y1:cardMidY, x2:left, y2:cardMidY});
    centers.push(cardMidY);
    if (isLeft) leftTop = treeBottom + ROW_GAP; else rightTop = treeBottom + ROW_GAP;
    maxBottom = Math.max(maxBottom, treeBottom);
  });

  // 中心竖线
  if (centers.length){
    lines.push({type:'spine', x1:CENTER_X, y1:centerBottom, x2:CENTER_X, y2:Math.max(...centers)});
  }

  // 隐藏旧版 div 连线，统一用 SVG
  const spine = page.querySelector('.spine'); if (spine) spine.style.display = 'none';
  page.querySelectorAll('.crossbar').forEach(b => b.style.display = 'none');

  renderLines(diagram, lines);
  diagram.style.height = (maxBottom + 20) + 'px';
  // 根据最右侧卡片自动扩展 diagram 宽度，便于子卡片向右展开时横向滚动查看
  let maxRight = 680;
  allCards.forEach(c => {
    if (c.style.display === 'none') return;
    const r = parseFloat(c.style.left || 0) + c.offsetWidth;
    if (r > maxRight) maxRight = r;
  });
  diagram.style.minWidth = (maxRight + 24) + 'px';
}
function layout(){
  const p = document.querySelector('.page.active');
  if (p) layoutPage(p);
}

  const edit = document.createElement('div');

  const toolbar = document.createElement('div'); toolbar.className = 'note-toolbar';
  const imgBtn = document.createElement('button'); imgBtn.className = 'add-img'; imgBtn.textContent = '插入图片';
  const fileInput = document.createElement('input'); fileInput.type = 'file';
  fileInput.accept = 'image/*'; fileInput.hidden = true;
  toolbar.appendChild(imgBtn); toolbar.appendChild(fileInput);
  const ta = document.createElement('textarea'); ta.className = 'note-input'; ta.rows = 3;
  ta.placeholder = '支持 Markdown：**粗体** *斜体* `代码` # 标题 > 引用 - 列表；可 Ctrl+V 粘贴图片';
  ta.value = md;
  const actRow = document.createElement('div'); actRow.className = 'img-edit-actions';
  const submitBtn = document.createElement('button'); submitBtn.className = 'submit-note'; submitBtn.textContent = '提交';
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'cancel-img'; cancelBtn.textContent = '取消';
  actRow.appendChild(submitBtn); actRow.appendChild(cancelBtn);
  edit.appendChild(toolbar); edit.appendChild(ta); edit.appendChild(actRow);

  item.appendChild(view); item.appendChild(edit); list.appendChild(item);

  const isNew = editing && !md;
  const showView = () => { view.style.display = 'flex'; edit.style.display = 'none'; };
  const showEdit = () => { view.style.display = 'none'; edit.style.display = 'flex'; ta.focus(); };
  const syncMd = () => { item.dataset.md = ta.value; };
  function insertImg(dataUrl){
    const token = '![图片](' + dataUrl + ')\n';
    const s = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    const e2 = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
    ta.value = ta.value.slice(0, s) + token + ta.value.slice(e2);
    syncMd();
    const pos = s + token.length; ta.focus(); ta.setSelectionRange(pos, pos);
  }

  ta.addEventListener('paste', e => {
    const cd = e.clipboardData || window.clipboardData; if (!cd) return;
    const it = Array.from(cd.items || []).find(x => x.type && x.type.indexOf('image') === 0);
    if (it){ e.preventDefault(); const f = it.getAsFile(); if (f) compressImage(f, insertImg); }
  });
  ta.addEventListener('input', syncMd);
  ta.addEventListener('click', e => e.stopPropagation());
  imgBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  fileInput.addEventListener('change', e => {
    e.stopPropagation(); const f = e.target.files[0];
    if (f) compressImage(f, insertImg); fileInput.value = '';
  });
  submitBtn.addEventListener('click', e => {
    e.stopPropagation(); syncMd();
    render.innerHTML = item.dataset.md ? renderMarkdown(item.dataset.md) : '<span class="note-empty">(空笔记)</span>';
    showView(); saveNotes(card); layout();

  cancelBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (isNew){ item.remove(); layout(); } else { ta.value = item.dataset.md; showView(); }
  });
  delBtn.addEventListener('click', e => {

      if (!ok) return; item.remove(); saveNotes(card); layout();
    });

  view.addEventListener('dblclick', e => {
    if (e.target.closest('.note-actions')) return;
    if (e.target.tagName === 'IMG') return;
    e.stopPropagation(); item.classList.remove('selected');
    ta.value = item.dataset.md; showEdit(); layout();
  });

  if (editing) showEdit(); else showView();
}

/* ================= Markdown ================= */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,u) => '<img alt="' + a.replace(/"/g,'') + '" src="' + u + '">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/(^|[^_])_([^_]+)_(?!_)/g, '$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function renderMarkdown(md){
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  let html = '', listType = null, listBuf = [];
  function closeList(){
    if (!listType) return;
    html += '<' + listType + '>\n' + listBuf.map(li => '  <li>' + inlineMd(li) + '</li>').join('\n') + '\n</' + listType + '>\n';
    listType = null; listBuf = [];
  }
  let i = 0;
  while (i < lines.length){
    let line = lines[i];
    if (/^```/.test(line)){
      closeList(); i++; let code = '';
      while (i < lines.length && !/^```/.test(lines[i])){ code += lines[i] + '\n'; i++; }
      i++; html += '<pre><code>' + esc(code) + '</code></pre>\n'; continue;
    }
    let h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ closeList(); const lv = h[1].length; html += '<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>\n'; i++; continue; }
    let bq = line.match(/^>\s?(.*)$/);
    if (bq){ closeList(); html += '<blockquote>' + inlineMd(bq[1]) + '</blockquote>\n'; i++; continue; }
    let ul = line.match(/^[-*]\s+(.*)$/);
    if (ul){ if (listType !== 'ul'){ closeList(); listType = 'ul'; } listBuf.push(ul[1]); i++; continue; }
    let ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol){ if (listType !== 'ol'){ closeList(); listType = 'ol'; } listBuf.push(ol[1]); i++; continue; }
    if (/^\s*$/.test(line)){ closeList(); i++; continue; }
    closeList();
    let para = line;
    while (i + 1 < lines.length && !/^\s*$/.test(lines[i+1]) &&
           !/^(#{1,6}\s|>\s?|[-*]\s|\d+\.\s|```)/.test(lines[i+1])){ i++; para += '\n' + lines[i]; }
    html += '<p>' + inlineMd(para) + '</p>\n'; i++;
  }
  closeList(); return html;
}

/* ================= 图片 ================= */
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1600; let { width, height } = img;
      if (width > maxW){ height = Math.round(height * maxW / width); width = maxW; }
      const cv = document.createElement('canvas');
      cv.width = width; cv.height = height;
      cv.getContext('2d').drawImage(img, 0, 0, width, height);
      try { cb(cv.toDataURL('image/jpeg', 0.85)); }
      catch (err){ showToast('图片过大，无法保存，请换一张较小的图片。'); }
    };
    img.onerror = () => showToast('图片读取失败，请重试或更换图片');
    img.src = e.target.result;
  };

/* ================= 确认弹窗 ================= */
function showConfirm(message){
  return new Promise(resolve => {
    const ov = document.getElementById('modal');
    const msg = document.getElementById('modal-msg');
    const ok = document.getElementById('modal-ok');
    const cancel = document.getElementById('modal-cancel');
    msg.textContent = message; ov.style.display = 'flex';
    function done(r){
      ov.style.display = 'none'; ok.onclick = null; cancel.onclick = null; ov.onclick = null; resolve(r);
    }
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
    ov.onclick = e => { if (e.target === ov) done(false); };
  });
}

/* ================= 发音 ================= */
function pickVoice(){
  const vs = window.speechSynthesis.getVoices();
  return vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
function speakWord(word){
  if (!word) return;
  if (!('speechSynthesis' in window)){ showToast('当前环境不支持语音合成，请用本地浏览器打开'); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = pickVoice(); if (v) u.voice = v;
    let spoken = false;
    u.onstart = () => { spoken = true; };
    u.onerror = () => showToast('预览环境发音受限：点上方「下载本页」用本地浏览器打开即可正常发音');
    setTimeout(() => window.speechSynthesis.speak(u), 60);
    setTimeout(() => {
      if (!spoken && window.speechSynthesis.speaking === false && window.self !== window.top)
        showToast('预览环境发音受限：点上方「下载本页」用本地浏览器打开即可正常发音');
    }, 460);
  } catch (e){ showToast('发音失败，请用本地浏览器打开本文件'); }
}

let _tt = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ================= 下载 ================= */
function downloadHTML(){
  const clone = document.documentElement.cloneNode(true);
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.title || '词根思维导图') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= 功能2：自定义标题颜色 ================= */
function pickText(hex){
  const c = (hex || '').replace('#','');
  if (c.length < 6) return '#1a1a1a';
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const L = (0.299*r + 0.587*g + 0.114*b) / 255;
  return L > 0.6 ? '#1a1a1a' : '#ffffff';
}

/* ================= 功能3：卡片嵌套（父子分支） ================= */
function toggleNest(){
  const page = document.querySelector('.page.active');
  if (!page) return;
  const diagram = page.querySelector('.diagram');
  // 退出排序模式
  if (diagram.classList.contains('sorting')){
    diagram.classList.remove('sorting');
    page.querySelectorAll('.card').forEach(c => c.draggable = false);
    const sb = document.getElementById('sortBtn'); if (sb){ sb.classList.remove('active'); sb.textContent = '🔃 调整顺序'; }
  }
  const on = diagram.classList.toggle('nesting');
  page.querySelectorAll('.card').forEach(c => c.draggable = on);
  const btn = document.getElementById('nestBtn');
  if (btn){ btn.classList.toggle('active', on); btn.textContent = on ? '✅ 完成嵌套' : '🌿 嵌套'; }
  layout();
}
function applyNesting(idx){
  const page = document.querySelector('.page[data-idx="' + idx + '"]');
  if (!page) return;
  const diagram = page.querySelector('.diagram');
  const cardByWord = {};
  page.querySelectorAll('.card').forEach(c => { cardByWord[c.dataset.word] = c; });

  // 重置所有卡片的父子样式
  page.querySelectorAll('.card').forEach(c => {
    c.classList.remove('child', 'has-child');
    c.removeAttribute('data-parent');
    const b = c.querySelector('.branch-badge'); if (b) b.remove();
  });

  // 应用 parent 映射，并检查成环
  page.querySelectorAll('.card').forEach(card => {
    const pid = UD.parent[ckey(card)];
    if (pid && cardByWord[pid] && cardByWord[pid] !== card){
      let cur = cardByWord[pid], cycle = false;
      while (cur){
        if (cur.dataset.parent === card.dataset.word){ cycle = true; break; }
        cur = cardByWord[cur.dataset.parent];
      }
      if (!cycle){
        card.classList.add('child');
        card.dataset.parent = pid;
        cardByWord[pid].classList.add('has-child');
      } else {
        UD.parent[ckey(card)] = null;
      }
    } else if (pid){
      UD.parent[ckey(card)] = null;
    }
  });

  // 把子卡片移到父卡片之后，使同一父的子卡片连续排列
  page.querySelectorAll('.card.child').forEach(card => {
    const parent = cardByWord[card.dataset.parent];
    if (parent && card.previousElementSibling !== parent){
      diagram.insertBefore(card, parent.nextElementSibling);
    }
  });

  // 父卡片子卡片计数徽章
  page.querySelectorAll('.card.has-child').forEach(p => {
    const n = page.querySelectorAll('.card.child[data-parent="' + cssEscape(p.dataset.word) + '"]').length;
    let b = p.querySelector('.branch-badge');
    if (!b){ b = document.createElement('span'); b.className = 'branch-badge'; p.querySelector('.header-right').insertBefore(b, p.querySelector('.header-right').firstChild); }
    b.textContent = '🌿' + n;
  });

  layoutPage(page);
}
function isDescendant(ancestor, node){
  const page = ancestor.closest('.page');
  let cur = node;
  while (cur){
    const p = cur.dataset.parent;
    if (!p) return false;
    if (p === ancestor.dataset.word) return true;
    cur = page.querySelector('.card[data-word="' + cssEscape(p) + '"]');
  }
  return false;
}
function bindNestDrag(diagram){
  if (!diagram) return;
  diagram.addEventListener('dragstart', e => {
    if (!diagram.classList.contains('nesting')) return;
    const card = e.target.closest('.card'); if (!card) return;
    _dragging = card; card.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', cardId(card)); } catch (_){}
    e.dataTransfer.effectAllowed = 'move';
  });
  diagram.addEventListener('dragend', e => {
    const c = e.target.closest('.card'); if (c) c.classList.remove('dragging');
    diagram.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
    _dragging = null;
  });
  diagram.addEventListener('dragover', e => {
    if (!diagram.classList.contains('nesting')) return;
    e.preventDefault();
    const card = e.target.closest('.card');
    diagram.querySelectorAll('.drop-target').forEach(x => { if (x !== card) x.classList.remove('drop-target'); });
    if (card && card !== _dragging) card.classList.add('drop-target');
  });
  diagram.addEventListener('drop', e => {
    if (!diagram.classList.contains('nesting')) return;
    e.preventDefault();
    const card = _dragging; if (!card) return;
    const target = e.target.closest('.card');
    const idx = parseInt(diagram.closest('.page').dataset.idx, 10);
    diagram.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (target && target !== card){
      if (isDescendant(card, target)){
        showToast('不能把自己拖到子卡片下方');
        card.classList.remove('dragging'); _dragging = null; return;
      }
      UD.parent[ckey(card)] = target.dataset.word;
    } else if (!target){
      UD.parent[ckey(card)] = null; // 拖到空白处 → 取消嵌套
    } else { card.classList.remove('dragging'); _dragging = null; return; }
    card.classList.remove('dragging');
    _dragging = null;
    persist();
    applyNesting(idx);
  });
}

function moveCard(btn, dir, e){
  if (e) e.stopPropagation();
  const card = btn.closest('.card');
  if (!card) return;
  const diagram = card.closest('.diagram');
  const cards = Array.from(diagram.querySelectorAll('.card:not(.child)'));
  const i = cards.indexOf(card);
  if (dir < 0 && i > 0) diagram.insertBefore(card, cards[i - 1]);
  else if (dir > 0 && i < cards.length - 1) diagram.insertBefore(card, cards[i + 1].nextSibling);
  else return;
  saveOrder(parseInt(diagram.closest('.page').dataset.idx, 10));
  layout();
}
function getDragAfterElement(container, y){
  const els = Array.from(container.querySelectorAll('.card:not(.child):not(.dragging)'));
  let closest = { offset: -Infinity, el: null };
  els.forEach(el => {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) closest = { offset: offset, el: el };
  });
  return closest.el;
}
function bindDiagramDrag(diagram){
  if (!diagram) return;
  diagram.addEventListener('dragstart', e => {
    const card = e.target.closest('.card');
    if (!card || !diagram.classList.contains('sorting')) return;
    _dragging = card;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', cardId(card)); } catch (_){}
    card.classList.add('dragging');
  });
  diagram.addEventListener('dragend', e => {
    const card = e.target.closest('.card');
    if (card) card.classList.remove('dragging');
    _dragging = null;
  });
  diagram.addEventListener('dragover', e => {
    if (!diagram.classList.contains('sorting')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  diagram.addEventListener('drop', e => {
    if (!diagram.classList.contains('sorting')) return;
    e.preventDefault();
    const card = _dragging;
    if (!card) return;
    const after = getDragAfterElement(diagram, e.clientY);
    if (after == null) diagram.appendChild(card);
    else diagram.insertBefore(card, after);
    card.classList.remove('dragging');
    _dragging = null;
    saveOrder(parseInt(diagram.closest('.page').dataset.idx, 10));
    layout();
  });
}

/* ================= 统一应用用户态（收藏/笔记/颜色/自制/顺序/嵌套） ================= */

function applyUserState(){
  document.querySelectorAll('.page').forEach(p => {
    const idx = parseInt(p.dataset.idx, 10);

      card.classList.remove('has-child', 'child'); card.removeAttribute('data-parent');
      const b = card.querySelector('.branch-badge'); if (b) b.remove();
      applyCardColor(card, '');
      card.classList.remove('faved');
      const fb = card.querySelector('.fav-btn'); if (fb){ fb.classList.remove('on'); fb.textContent = '☆'; }
    });
    // 渲染自制卡
    (UD.custom[idx] || []).forEach(c => renderCustomCard(idx, c));
    // 统一应用 收藏/笔记/颜色 到所有卡片
    p.querySelectorAll('.card').forEach(card => applyOneCard(card));
    applyOrder(idx);
    applyNesting(idx);
  });
}

/* ================= 功能1：Supabase 登录 / 同步 ================= */
let sb = null, sbUser = null;
function renderUserBox(){
  const b = document.getElementById('userBox'); if (!b) return;
  if (sbUser){ b.innerHTML = '<span class="ub-badge">👤 ' + esc(sbUser.email || '已登录用户') + '</span><button class="ub-logout" onclick="doLogout()">登出</button>'; }
  else b.innerHTML = '';
}
function showGate(show){ const g = document.getElementById('authGate'); if (g) g.style.display = show ? 'flex' : 'none'; }
function authErr(m){ const e = document.getElementById('auth-err'); if (e) e.textContent = m || ''; }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function setupGate(){
  const tg = document.getElementById('tabLogin'), tr = document.getElementById('tabReg');
  let mode = 'login';
  if (tg) tg.onclick = () => { mode = 'login'; tg.classList.add('active'); tr.classList.remove('active'); document.getElementById('auth-submit').textContent = '登录'; authErr(''); };
  if (tr) tr.onclick = () => { mode = 'register'; tr.classList.add('active'); tg.classList.remove('active'); document.getElementById('auth-submit').textContent = '注册'; authErr(''); };
  const sb = document.getElementById('auth-submit');
  if (sb) sb.onclick = () => { mode === 'login' ? doLogin() : doRegister(); };
}
async function sbLoad(){
  if (!sb || !sbUser) return;
  const { data, error } = await sb.from('user_data').select('data').eq('user_id', sbUser.id).maybeSingle();
  if (data && data.data && JSON.stringify(data.data) !== '{}') Object.assign(UD, sanitizeUD(data.data));
  persistLocal();
}
function sbSave(){
  if (!sb || !sbUser) return;
  clearTimeout(_sbSaveT);
  _sbSaveT = setTimeout(async () => {
    const { error } = await sb.from('user_data').upsert(
      { user_id: sbUser.id, data: UD, updated_at: new Date().toISOString() },
      { onConflict: 'user_id' }
    );
    if (error) showToast('云端同步失败：' + (error.message || '未知错误'));
  }, 600);
}
async function doLogin(){
  const e = val('auth-email'), p = val('auth-pass');
  if (!e || !p){ authErr('请输入邮箱和密码'); return; }
  if (!sb){ authErr('云端服务未就绪，请刷新页面重试'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email: e, password: p });
  if (error){ authErr(error.message); return; }
  await afterAuth(data.user || (data.session && data.session.user));
}
async function doRegister(){
  const e = val('auth-email'), p = val('auth-pass');
  if (!e || !p){ authErr('请输入邮箱和密码'); return; }
  if (p.length < 6){ authErr('密码至少 6 位'); return; }
  if (!sb){ authErr('云端服务未就绪，请刷新页面重试'); return; }
  const { data, error } = await sb.auth.signUp({ email: e, password: p });
  if (error){ authErr(error.message); return; }
  if (data.session){ await afterAuth(data.user || data.session.user); }
  else { authErr('注册成功！请到邮箱查收验证邮件后登录（或在 Supabase 后台 Authentication → Providers → Email 关闭“Confirm email”以直接登录）'); }
}
async function afterAuth(passedUser){
  let user = passedUser || null;
  if (!user && sb){
    try { const { data } = await sb.auth.getUser(); user = data.user || null; } catch (e){ user = null; }
  }
  if (!user){ authErr('登录状态获取失败，请重试'); showGate(true); return; }
  sbUser = user;
  await sbLoad();
  showGate(false); renderUserBox(); showToast('已登录：' + (sbUser.email || ''));
  applyUserState();
}
async function doLogout(){
  if (sb){ await sb.auth.signOut().catch(() => {}); }
  sbUser = null; renderUserBox(); showGate(true); showToast('已登出');
}
function initAuth(){
  showGate(true); // 默认先盖住内容，避免 Supabase 国内网络慢导致门禁迟迟不出现
  if (typeof window.supabase === 'undefined'){
    authErr('云端服务连接中，若长时间未出现登录框请刷新页面重试');
    return; // 仍显示门禁；不提供本地模式绕过
  }
  if (!SB_ENABLED){ authErr('登录服务配置异常，请刷新页面重试'); return; } // 未配置 Supabase 时保持门禁，绝不放行
  if (location.protocol === 'file:'){ authErr('本地文件模式不支持登录，请改用线上地址访问'); return; }
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }
  catch (e){ authErr('云端初始化失败，请刷新页面重试'); return; }
  sb.auth.getUser().then(({ data }) => {
    if (data && data.user){ sbUser = data.user; sbLoad().then(() => { showGate(false); renderUserBox(); applyUserState(); }); }
    // 未登录：保持门禁显示，强制登录 / 注册（未注册用户无法进入）
  }).catch(() => { authErr('云端暂时不可达，请刷新页面重试'); /* 保持门禁，不提供本地模式 */ });
}

/* ================= 初始化 ================= */
window.addEventListener('load', () => {
  migrateLegacy();
  buildNav();
  buildPages();
  // 内置卡片：补笔记区与收藏、配色按钮
  document.querySelectorAll('.card:not(.custom-card)').forEach(c => { buildCustomArea(c); buildFav(c); bindColorBtn(c); });
  // 内置发音按钮
  document.querySelectorAll('.speak').forEach(b => {
    if (b.closest('.custom-card')) return;
    b.addEventListener('click', e => { e.stopPropagation(); speakWord(b.dataset.word || ''); });
  });
  // 添加卡片表单
  document.getElementById('cf-ok').addEventListener('click', submitAddCard);
  document.getElementById('cf-cancel').addEventListener('click', closeAddCard);
  document.getElementById('addCardModal').addEventListener('click', e => {
    if (e.target.id === 'addCardModal') closeAddCard();
  });
  CF_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && el.tagName !== 'TEXTAREA'){ e.preventDefault(); submitAddCard(); }
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.note-item'))
      document.querySelectorAll('.note-item.selected').forEach(n => n.classList.remove('selected'));
  });
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  if (window.self !== window.top){
    const tip = document.getElementById('env-tip');
    if (tip){ tip.textContent = '⚠ 预览环境发音受限，点「下载本页」用本地浏览器打开即可正常发音'; tip.style.display = 'inline-block'; }
  }
  bindSearch();
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('show');
  });
  document.getElementById('scrim').addEventListener('click', closeSidebar);

  setupGate();
  applyUserState();   // 先按本地缓存渲染用户数据
  initAuth();         // 再视情况显示登录门禁 / 自动登录

  let start = 0;
  const h = location.hash.match(/^#r(\d+)$/);
  start = h ? Math.min(parseInt(h[1], 10), ROOTS.length - 1) : 0;
  gotoRoot(start, true);

  if (location.protocol !== 'file:' && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(() => {
      let _swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!_swReloading){ _swReloading = true; location.reload(); }
      });
    }).catch(() => {});
  }
});
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(layout, 120); });
</script>
